services:
  wiauto-backend:
    container_name: wiauto-backend
    build:
      target: production
      context: .
      args:
        - PORT=${PORT:-4000}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    env_file: .env

    networks:
      - wiauto-network

    depends_on:
      - postgres
      - redis

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512m"
        reservations:
          cpus: "0.25"
          memory: "256m"

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: wiauto-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=wiauto-opensearch
      - node.name=wiauto-opensearch-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=odP.L97brnxM%
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - wiauto-network

  postgres:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=wiautopassword
      - POSTGRES_DB=wiauto
    networks:
      - wiauto-network
    env_file: .env
    ports:
      - 5434:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wiauto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    networks:
      - wiauto-network
    ports:
      - 6381:6379
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
networks:
  wiauto-network:
    driver: bridge
